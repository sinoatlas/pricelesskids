<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>高性价比养娃指南 · 江苏版</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#213a3b;background:#f4f3ed;line-height:1.75}body{margin:0}header{background:#153e3c;color:#fff;padding:40px max(5vw,20px)}h1{font-size:clamp(26px,4vw,43px);margin:8px 0}header p{max-width:850px;color:#d8e8df}.eyebrow{color:#edc982;letter-spacing:.12em}main{max-width:1120px;margin:auto;padding:24px 20px}.toolbar{display:grid;grid-template-columns:2fr 1.3fr 1fr 1fr;gap:10px;position:sticky;top:0;background:#f4f3ed;padding:16px 0;z-index:2}input,select,button{font:inherit;border:1px solid #b9c5bc;border-radius:8px;padding:10px;background:#fff;color:#213a3b}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #a25d00;outline-offset:2px}.stats{font-size:14px;color:#536764}article{background:#fff;border:1px solid #dae1d8;border-radius:12px;margin:16px 0;padding:22px}h2{margin:8px 0 15px;font-size:21px}.meta{font-size:13px;color:#60726a;display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{display:inline-block;background:#e6eee4;border-radius:20px;padding:2px 10px}.action{border-left:3px solid #1d7166;padding-left:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px}dl{margin:0}dt{font-size:13px;color:#6d7769}dd{margin:0 0 10px}a{color:#116458}header a{color:#edc982}.boundary{background:#fbf4e5;padding:10px 14px;font-size:14px;border-radius:6px}.refs{font-size:14px}footer{padding:30px;color:#536764;text-align:center}summary{cursor:pointer}button.star{border:0;background:transparent;font-size:14px;white-space:nowrap}.empty{padding:40px;text-align:center}@media(max-width:720px){.toolbar{grid-template-columns:1fr 1fr;position:static}.toolbar input{grid-column:1/-1}.grid{grid-template-columns:1fr}header{padding:28px 20px}article{padding:17px}.meta{align-items:flex-start}}@media print{.toolbar,button.star{display:none}article{break-inside:avoid}header{background:#fff;color:#000}header p{color:#333}a{color:#000}}
</style></head><body><header><div class="eyebrow">JIANGSU · 从出生到大学毕业</div><h1>高性价比养娃指南</h1><p>把钱、时间和精力花在健康、安全、稳定照护与孩子的选择机会。成本、收益、适用条件和来源，一起看。</p><p>核验：2026-10-10 · 独立资料整理，未经机构认证 · 数字预算为教学示例</p><a href="README.md">项目说明</a> · <a href="docs/cities.md">江苏13市</a> · <a href="docs/budget.md">预算模型</a> · <a href="docs/checklists.md">办事清单</a> · <a href="docs/sources.md">核验台账</a> · <a href="docs/methodology.md">依据怎么读</a></header>
<main><div class="toolbar"><input id="query" type="search" aria-label="搜索条目" placeholder="搜索：医保、托育、近视、志愿……"><select id="chapter" aria-label="主题"><option value="">全部主题</option></select><select id="evidence" aria-label="依据类型"><option value="">全部依据</option><option value="P">政策 P</option><option value="G">指南 G</option><option value="J">含编辑判断 J</option><option value="U">待核 U</option></select><select id="favorite" aria-label="收藏筛选"><option value="">全部条目</option><option value="yes">仅收藏</option></select></div><p id="stats" class="stats" aria-live="polite"></p><div id="results"></div><noscript>启用JavaScript后可检索。也可打开 docs/complete-guide.md 阅读完整文字。</noscript></main><footer>不联网检索，不上传搜索和收藏。收藏保存在当前浏览器；隐私模式可能无法持久保存。<br>政策更新及待核项请看项目文档。</footer>
<script>
'use strict';const data=/*__DATA__*/;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let saved=new Set();try{saved=new Set(JSON.parse(localStorage.getItem('pricelesskids-favorites-v1')||'[]'));}catch(e){}
const $=id=>document.getElementById(id);const chapterNames=Object.fromEntries(data.chapters.map(c=>[c.slug,c.title]));
for(const c of data.chapters){let o=document.createElement('option');o.value=c.slug;o.textContent=c.title;$('chapter').append(o);}
function render(){let q=$('query').value.trim().toLocaleLowerCase();let cs=$('chapter').value, ev=$('evidence').value, fav=$('favorite').value;
let found=data.items.filter(x=>(!cs||x.chapter===cs)&&(!ev||x.evidence.includes(ev))&&(!fav||saved.has(x.id))&&(!q||JSON.stringify(x).toLocaleLowerCase().includes(q)));
$('stats').textContent=`显示 ${found.length} / ${data.items.length} 条 · ${data.chapters.length} 主题 · 优先级为编辑判断，不是证据等级`;
$('results').innerHTML=found.length?found.map(x=>{let ref=x.sources.map(id=>{let s=data.sources[id];return `<li><a href="${escapeHTML(s.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(id+' · '+s.title)}</a> — ${escapeHTML(s.status)}<br>适用：${escapeHTML(s.scope)}</li>`}).join('');let fields=[['金钱成本',x.money],['时间精力',x.time],['收益',x.gain],['条件',x.condition]];return `<article id="${escapeHTML(x.id)}"><div class="meta"><span>${escapeHTML(chapterNames[x.chapter])}<br>${escapeHTML(x.id+' · '+x.age)}</span><button class="star" data-id="${escapeHTML(x.id)}" aria-pressed="${saved.has(x.id)}">${saved.has(x.id)?'★ 已收藏':'☆ 收藏'}</button></div><h2>${escapeHTML(x.title)}</h2><span class="pill">优先级 ${escapeHTML(x.priority)}</span><p class="action">${escapeHTML(x.action)}</p><div class="grid">${fields.map(([k,v])=>`<dl><dt>${k}</dt><dd>${escapeHTML(v)}</dd></dl>`).join('')}</div><p class="boundary">${escapeHTML(x.boundary)}</p><details><summary>依据与原始出处 · ${escapeHTML(x.evidence)}</summary><p>核验 ${escapeHTML(x.checked)}。带出处不代表建议部分全部为该出处原话。</p><ul class="refs">${ref||'<li>原创决策建议；无直接效果研究。</li>'}</ul></details></article>`}).join(''):'<p class="empty">没有匹配条目，试试更短的关键词或取消筛选。</p>';
}
for(const id of ['query','chapter','evidence','favorite'])$(id).addEventListener(id==='query'?'input':'change',render);
$('results').addEventListener('click',e=>{let b=e.target.closest('button[data-id]');if(!b)return;let id=b.dataset.id;saved.has(id)?saved.delete(id):saved.add(id);try{localStorage.setItem('pricelesskids-favorites-v1',JSON.stringify([...saved]));}catch(e){}render();});render();
</script></body></html>
